<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sugar Rush Social</title>
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍭</text></svg>">
</head>
<body>
  <div class="glow glow-a"></div>
  <div class="glow glow-b"></div>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">🍭</span>
      <span class="brand-name">Sugar Rush Social</span>
    </div>

    <div class="topbar-right">
      <span class="fun-pill" data-i18n="fun.pill"></span>
      <label class="lang">
        <span class="lang-icon" aria-hidden="true">🌐</span>
        <select data-lang-select data-i18n-aria="lang.label"></select>
      </label>
    </div>
  </header>

  <main class="lobby">
    <section class="hero">
      <div class="hero-copy">
        <span class="hero-kicker" data-i18n="hero.kicker"></span>
        <h1 class="hero-title">Sweet&nbsp;Bonanza</h1>
        <p class="hero-text" data-i18n="hero.text"></p>
        <div class="hero-stats">
          <div><b>6×5</b><span data-i18n="hero.stat.grid"></span></div>
          <div><b data-i18n="hero.stat.cascades"></b><span data-i18n="hero.stat.mechanic"></span></div>
          <div><b data-i18n="hero.stat.upto"></b><span data-i18n="hero.stat.multipliers"></span></div>
        </div>
        <button class="play-btn" data-play="sweet-bonanza" data-i18n="hero.cta"></button>
      </div>
      <div class="hero-art" data-hero-art></div>
    </section>

    <section class="notice">
      <span class="notice-icon" aria-hidden="true">🎈</span>
      <div><b data-i18n="notice.title"></b> <span data-i18n="notice.body"></span></div>
    </section>

    <div class="lobby-body">
      <section class="games">
        <h2 class="section-title" data-i18n="section.games"></h2>
        <div class="game-grid" data-games></div>
      </section>

      <aside class="side">
        <h2 class="section-title" data-i18n="section.recent"></h2>
        <ul class="recent" data-recent></ul>
        <p class="recent-empty" data-recent-empty data-i18n="recent.empty"></p>
      </aside>
    </div>
  </main>

  <div class="overlay" data-game-overlay hidden>
    <div class="overlay-bar">
      <span class="overlay-title" data-game-title></span>
      <div class="overlay-actions">
        <button data-fullscreen data-i18n-title="overlay.fullscreen">⛶</button>
        <button data-close-game data-i18n-title="overlay.close">✕</button>
      </div>
    </div>
    <div class="overlay-frame">
      <div class="frame-loader" data-frame-loader><span></span><i data-i18n="overlay.loading"></i></div>
      <iframe data-game-frame title="Game" allow="autoplay; fullscreen" allowfullscreen></iframe>
    </div>

    <nav class="game-nav" data-i18n-aria="nav.lobby">
      <button class="nav-back" data-close-game data-i18n-aria="nav.back">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <button class="nav-home" data-close-game data-i18n-aria="nav.lobby">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7"/><path d="M6 10v9h12v-9"/></svg>
        <span data-i18n="nav.lobby"></span>
      </button>
    </nav>
  </div>

  <footer class="footer" data-i18n="footer"></footer>

  <script src="app.js" type="module"></script>
</body>
</html>
